<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de Contexto C4 (Nivel 1) de SecurityBus: actores, la plataforma y los sistemas externos con los que se relaciona" font-family="Segoe UI, Helvetica, Arial, sans-serif">
